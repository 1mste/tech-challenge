apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service-scaledobject
  namespace: tech-challenge2
spec:
  scaleTargetRef:
    name: analytics-service
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: analytics-keda-auth
      metadata:
        queueURL: "<AWS_SQS_URL>"
        queueLength: "5"
        awsRegion: "<AWS_REGION>"

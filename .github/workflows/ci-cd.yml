name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics-service, auth-service, evaluation-service, flag-service, targeting-service]
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python (para Analytics)
        if: matrix.service == 'analytics-service'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Go (para demais serviços)
        if: matrix.service != 'analytics-service'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 1. Build & Unit Test (Python)
        if: matrix.service == 'analytics-service'
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt || true

      - name: 1. Build & Unit Test (Go)
        if: matrix.service != 'analytics-service'
        run: |
          cd ${{ matrix.service }}
          if [ -f "go.mod" ]; then
            go build -v ./...
            go test -v ./... || true
          fi

      - name: 2. Linter / Static Analysis (Python - Flake8)
        if: matrix.service == 'analytics-service'
        run: |
          echo "Rodando flake8 no analytics-service..."
          cd ${{ matrix.service }}
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: 2. Linter / Static Analysis (Go - golangci-lint)
        if: matrix.service != 'analytics-service'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          working-directory: ${{ matrix.service }}

      - name: 3. Security Scan - SCA & SAST (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: '${{ matrix.service }}'
          format: 'table'
          exit-code: '0'

      - name: 4. Regra de Bloqueio (Critical Gate)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: '${{ matrix.service }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL'
          exit-code: '1'
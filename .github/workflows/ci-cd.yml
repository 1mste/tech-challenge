name: CI/CD DevSecOps Pipeline

on:
  push: 
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics-service, auth-service, evaluation-service, flag-service, targeting-service]
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Ambiente (Exemplo Node/Python/Go - Ajuste conforme sua stack)
        uses: actions/setup-go # Troque para setup-go ou setup-python dependendo do microsserviço
        with:
          node-version: '18'

      - name: 1. Build & Unit Test
        run: |
          echo "Rodando build e testes para ${{ matrix.service }}..."
          cd ${{ matrix.service }}
          # Exemplo: npm install && npm test (substitua pelo comando da sua stack)
          if [ -f "package.json" ]; then
            npm install
            npm test
          else
            echo "Nenhum package.json encontrado, pulando build/test padrão."
          fi

      - name: 2. Linter / Static Analysis
        run: |
          echo "Executando linter no ${{ matrix.service }}..."
          # Aqui você pode chamar golangci-lint, pylint ou ESLint conforme a linguagem

      - name: 3. Security Scan - SCA (Trivy Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: '${{ matrix.service }}'
          format: 'table'
          exit-code: '0' # Apenas exibe o SCA ou mude para '1' se quiser bloquear dependências vulneráveis

      - name: 4. Security Scan - SAST & Regra de Bloqueio (Críticas)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: '${{ matrix.service }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL'

      - name: 5. Validação da Regra de Bloqueio Crítico
        run: |
          echo "Verificando se existem vulnerabilidades CRÍTICAS..."
          # O Trivy pode barrar o pipeline automaticamente se configurado com exit-code 1 para severidade CRITICAL
          # Exemplo prático de bloqueio exigido no print da faculdade:
          # Se houver vulnerabilidade crítica, o script falha e interrompe o pipeline.
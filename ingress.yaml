apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: tech-challenge2
spec:
  ingressClassName: nginx
  rules:
    - host: microservices.local #colocar dominio depois
      http:
        paths:
          - path: /auth #nome da pasta
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /flag #nome da pasta
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 80
          - path: /targeting #nome da pasta
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 80
          - path: /evaluation #nome da pasta
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port:
                  number: 80
          - path: /analytics #nome da pasta
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 80
# Um Ingress por namespace: o objeto Ingress so enxerga Services do seu
# proprio namespace. O Nginx junta todos sob o mesmo Load Balancer.
#
# Sem "host": atende qualquer endereco, inclusive o DNS do NLB da AWS.
# rewrite-target: /$2 faz /auth/algo chegar na aplicacao como /algo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  namespace: auth-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 80

# Como o KEDA consulta o tamanho da fila sem access key.
#
# O operador do KEDA usa a PROPRIA IRSA (ServiceAccount keda-operator no
# namespace keda), anotada pelo Terraform em modules/k8s-addons. A permissao
# dela e minima: so sqs:GetQueueAttributes e GetQueueUrl.
#
# Historico: antes estava com identityOwner: workload, na ideia de o KEDA
# usar a IRSA da propria aplicacao. Nao funciona — para assumir a role de
# alguem, o operador precisa primeiro ter uma credencial sua, e a
# ServiceAccount dele nao tinha nenhuma. O sintoma era:
#   "GetQueueAttributes ... no EC2 IMDS role found"
#
# identityOwner: keda PRECISA ser explicito (valores validos: keda, workload). Omitir nao usa o padrao
# que eu esperava: o KEDA assume o comportamento "workload" e tenta assumir
# a role da aplicacao, resultando em:
#   "keda-irsa is not authorized to perform: sts:AssumeRole on
#    resource: .../analytics-irsa"
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: analytics-keda-auth
  namespace: analytics-service
spec:
  podIdentity:
    provider: aws
    identityOwner: keda

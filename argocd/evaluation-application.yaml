apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evaluation-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/1mste/tech-challenge.git
    targetRevision: main
    path: evaluation-service
  destination:
    server: https://kubernetes.default.svc
    namespace: tech-challenge2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

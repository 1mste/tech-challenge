apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: tech-challenge2

spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:

      containers:
        - name: evaluation-service
          image: <IMAGEM_ECR>
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-config
            - secretRef:
                name: evaluation-secret
          resources:
            requests:
              cpu: "100m" #50m
              memory: "128Mi" #64Mi
            limits:
              cpu: "500m" #250m
              memory: "512Mi" #128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10 #2
            periodSeconds: 10 #5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3